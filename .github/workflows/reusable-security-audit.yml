name: Security Audit

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: false

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🔒 pnpm audit
        run: pnpm audit --audit-level=high || echo "::warning::Vulnerabilities found in transitive dependencies - review required"
        continue-on-error: true

      - name: 🛡️ Snyk Security Scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}

      - name: 📋 OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          path: '.'
          format: 'HTML'
